<dialog id="placeDialog" class="place-detail" aria-labelledby="placeDetailTitle">
  <div class="dialog-head">
    <h2 id="placeDetailTitle"></h2>
    <button data-close aria-label="장소 닫기">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>
  <p id="placeDetailCategory" class="place-category" hidden></p>
  <p id="placeDetailAddress" class="note"></p>
  <div id="placeDetailActions" class="workspace-toolbar"></div>
  <div id="placeDetailPhotos" class="detail-photos"></div>
  <div id="placeDetailReviews"></div>
</dialog>
