<dialog id="photoDialog" aria-labelledby="photoTitle">
  <div class="dialog-head">
    <h2 id="photoTitle">사진</h2>
    <button data-close aria-label="사진 닫기">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>
  <div class="photo-stage">
    <img id="photoLarge" alt="" />
    <p id="photoError" hidden>사진을 불러오지 못했습니다.</p>
  </div>
  <div class="photo-controls">
    <button id="photoPrevious" aria-label="이전 사진">←</button
    ><span id="photoPosition" aria-live="polite"></span
    ><button id="photoNext" aria-label="다음 사진">→</button>
  </div>
  <p id="photoCaptionText" class="note"></p>
  <form id="photoMetaForm" hidden>
    <label>사진 설명<input id="photoCaptionInput" maxlength="500" /></label
    ><button class="primary small">설명 저장</button
    ><button type="button" id="photoTrash">휴지통으로</button>
  </form>
</dialog>
