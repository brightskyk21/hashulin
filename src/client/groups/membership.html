<dialog id="membershipDialog" aria-labelledby="membershipTitle">
  <div class="dialog-head">
    <h2 id="membershipTitle"></h2>
    <button data-close aria-label="멤버 변경 닫기">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>
  <p id="membershipMessage"></p>
  <p class="note">
    기존 리뷰와 사진은 모임에 남습니다. 미사용 초대 링크는 모두 취소되며, 다시 참여하려면 새 초대가
    필요합니다. 이미 열린 사진 링크는 최대 5분 후 만료됩니다.
  </p>
  <button id="confirmMembership" class="primary">확인</button>
</dialog>
